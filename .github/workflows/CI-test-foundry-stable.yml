# this file is copy of lib/bao-base/.github/workflows/CI-test-foundry-stable.yml
# the only modification is in the location of the action.
# TODO: check in the bao-base action to see if this file is up-to-date (modulo directory) with the lib/bao-base version it is a modified copy of
# if not, it should fail.

name: test-foundry-stable

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MAINNET_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY }}
  ARBITRUM_RPC_URL: https://arb-mainnet.g.alchemy.com/v2/${{ secrets.ARBITRUM_ALCHEMY_SECRET }}
  BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/${{ secrets.BASE_ALCHEMY_SECRET }}
  ALCHEMY_API_URL: ${{ secrets.ALCHEMY_API_URL }}

jobs:
  test_foundry_os:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            foundry: stable

          - os: macos-latest
            foundry: stable

          # - os: windows-latest
          #   foundry: stable

      fail-fast: false # ensure all jobs run even if one fails

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug RPC URL
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then echo "MAINNET_RPC_URL is empty";
          elif [[ "$MAINNET_RPC_URL" == *"/v2/" ]]; then echo "API key is missing from URL";
          else echo "MAINNET_RPC_URL appears set: '$MAINNET_RPC_URL'"; fi
          if [ -z "$ALCHEMY_API_URL" ]; then echo "ALCHEMY_API_URL is empty";
          elif [[ "$ALCHEMY_API_URL" == *"/v2/" ]]; then echo "API key is missing from URL";
          else echo "ALCHEMY_API_URL appears set: '$ALCHEMY_API_URL'"; fi

      - name: Run Bao-base CI actions
        uses: ./lib/bao-base/.github/actions/test-foundry
        with:
          foundry: ${{ matrix.foundry }}

# This file is a copy of lib/bao-base/.github/workflows/CI-test-foundry-stable.yml.
#
# It is entitled to differ in two ways and no more: where the action lives, and what its env: block
# ADDS — the chains this repo's fork tests read, which can only be spelled here because a composite
# action cannot access the secrets context. `lib/bao-base/run workflow_copy` runs early in the action
# and fails the build on any other difference, in either direction.
#
# Repo-specific diagnostics do NOT go here — a step of our own would be drift. They go in the `debug`
# script in package.json, which the action runs for us.

name: test-foundry-stable

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. The token is needed to clone the repository and its submodules, and to read
# foundry's public releases when resolving a nightly tag — both covered by contents:read. Without
# this block the workflow inherits the repository default, which is commonly write access to every
# scope, so any step (or any action it calls) could push to the repo or publish a release.
permissions:
  contents: read

env:
  MAINNET_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ARBITRUM_RPC_URL: https://arb-mainnet.g.alchemy.com/v2/${{ secrets.ARBITRUM_ALCHEMY_SECRET }}
  BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/${{ secrets.BASE_ALCHEMY_SECRET }}
  ALCHEMY_API_URL: ${{ secrets.ALCHEMY_API_URL }}

jobs:
  test_foundry_os:
    strategy:
      max-parallel: 1
      fail-fast: false # ensure all jobs run even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            foundry: stable

          - os: macos-latest
            foundry: stable

          # - os: windows-latest
          #   foundry: stable

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Bao-base CI actions
        uses: ./lib/bao-base/.github/actions/test-foundry
        with:
          foundry: ${{ matrix.foundry }}
